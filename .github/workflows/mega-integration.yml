name: MEGA version-retention integration

on:
  push:
    branches: [main]
    paths:
      - "src/destinations.py"
      - "src/processor.py"
      - ".github/workflows/mega-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x2telegram-mega-version-retention
  cancel-in-progress: false

jobs:
  verify-version-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install MEGAcmd
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ]; then
            echo "::error::MEGA_EMAIL and MEGA_PASSWORD must be configured to run live integration verification."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output /tmp/megacmd.deb
          sudo apt-get update -y
          sudo apt-get install -y /tmp/megacmd.deb

      - name: Upload two versions, verify both remotely, and compare downloaded bytes
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_TOTP_SECRET: ${{ secrets.MEGA_TOTP_SECRET }}
          MEGA_REMOTE_FOLDER: X2Telegram-IntegrationTests/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import os
          import subprocess
          import tempfile

          from src.destinations import MegaUploader

          run_id = os.environ["GITHUB_RUN_ID"]
          root = Path(os.environ["RUNNER_TEMP"]) / f"x2telegram-mega-test-{run_id}"
          root.mkdir(parents=True, exist_ok=True)
          payloads = {
              "version_a": b"X2Telegram MEGA retention integration test version A\n",
              "version_b": b"X2Telegram MEGA retention integration test version B with changed content\n",
          }
          files = {}
          for label, data in payloads.items():
              digest = sha256(data).hexdigest()
              name = f"retention_{run_id}_{label}_{digest}.txt"
              path = root / name
              path.write_bytes(data)
              files[name] = (path, data)

          uploader = MegaUploader(timeout_seconds=300)
          remote_folder = None
          try:
              for name, (path, _data) in files.items():
                  remote_folder = uploader.upload(path, name)
                  print(f"UPLOAD_VERIFIED name={name} remote_folder={remote_folder}")

              listing = uploader._run(["mega-ls", remote_folder], timeout=120)
              if listing.returncode != 0:
                  raise SystemExit("MEGA integration failed: remote folder listing failed.")
              missing = [name for name in files if name not in (listing.stdout or "")]
              if missing:
                  raise SystemExit("MEGA integration failed: one or more versioned files disappeared from the remote listing: " + ", ".join(missing))

              with tempfile.TemporaryDirectory(prefix="x2telegram-mega-download-") as download_dir:
                  for name, (_path, expected) in files.items():
                      remote_path = f"{remote_folder}/{name}"
                      result = uploader._run(["mega-get", remote_path, download_dir], timeout=300)
                      downloaded = Path(download_dir) / name
                      if result.returncode != 0 or not downloaded.is_file():
                          raise SystemExit(f"MEGA integration failed: could not download verified object {name}.")
                      actual = downloaded.read_bytes()
                      if actual != expected:
                          raise SystemExit(f"MEGA integration failed: remote bytes did not match uploaded content for {name}.")
                      print(f"CONTENT_VERIFIED name={name} bytes={len(actual)} sha256={sha256(actual).hexdigest()}")

              print("MEGA_VERSION_RETENTION_TEST=PASS")
          finally:
              # Remove only this run's isolated test directory; never touch production folders.
              if remote_folder:
                  test_root = f"/X2Telegram-IntegrationTests/{run_id}"
                  uploader._run(["mega-rm", "-r", "-f", test_root], timeout=120)
              uploader.close()
          PY
