name: MEGA media-identity and version-retention integration

on:
  push:
    branches: [main]
    paths:
      - "src/destinations.py"
      - "src/processor.py"
      - ".github/workflows/mega-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x2telegram-mega-media-identity
  cancel-in-progress: false

jobs:
  verify-media-identity-and-version-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install MEGAcmd
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ]; then
            echo "::error::MEGA_EMAIL and MEGA_PASSWORD must be configured to run live integration verification."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb" \
            --output /tmp/megacmd.deb
          echo "56828022459124f8ffe0276e5218718c1eda78f0299aded4eb5a159e9b8037b9  /tmp/megacmd.deb" | sha256sum --check --strict
          sudo apt-get update -y
          sudo apt-get install -y /tmp/megacmd.deb

      - name: Upload multiple media identities and a changed version; verify remote objects and bytes
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_TOTP_SECRET: ${{ secrets.MEGA_TOTP_SECRET }}
          MEGA_REMOTE_FOLDER: X2Telegram-IntegrationTests/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path
          import os
          import re
          import tempfile

          from src.config import Config
          from src.dedupe import DedupeStore
          from src.destinations import MegaUploader
          from src.metadata import Metadata, MetadataProvider
          from src.models import MediaItem
          from src.processor import PostProcessor
          from src.urls import parse_x_url

          run_id = os.environ["GITHUB_RUN_ID"]
          root = Path(os.environ["RUNNER_TEMP"]) / f"x2telegram-mega-test-{run_id}"
          root.mkdir(parents=True, exist_ok=True)
          expected_remote_root = f"/X2Telegram-IntegrationTests/{run_id}"
          payloads = {
              "https://fixture.invalid/item-1-high.mp4": [
                  b"X2Telegram item 1 version A integration fixture\n",
                  b"X2Telegram item 1 version B changed-content integration fixture\n",
              ],
              "https://fixture.invalid/item-2-high.mp4": [
                  b"X2Telegram item 2 distinct-content integration fixture\n",
                  b"X2Telegram item 2 distinct-content integration fixture\n",
              ],
          }

          class FixtureMetadata(MetadataProvider):
              def get(self, post):
                  return Metadata(post, [
                      MediaItem("video", "https://fixture.invalid/item-1-low.mp4", 0, bitrate=100),
                      MediaItem("video", "https://fixture.invalid/item-1-high.mp4", 0, bitrate=200),
                      MediaItem("video", "https://fixture.invalid/item-2-low.mp4", 1, bitrate=150),
                      MediaItem("video", "https://fixture.invalid/item-2-high.mp4", 1, bitrate=300),
                  ])

          post = parse_x_url("https://x.com/retentiontest/status/2100000000000000001")
          store = DedupeStore(root / "dedupe.json")
          uploader = MegaUploader(timeout_seconds=300)
          processor = PostProcessor(
              Config(destinations=("mega",)),
              FixtureMetadata(),
              dedupe=store,
              mega_uploader=uploader,
          )
          download_counts = Counter()
          remote_folder = expected_remote_root

          def fixture_download(url, _kind):
              variants = payloads.get(url)
              if variants is None:
                  raise RuntimeError("Integration fixture selected an unexpected media variant.")
              attempt = download_counts[url]
              if attempt >= len(variants):
                  raise RuntimeError("Integration fixture was requested more times than expected.")
              path = root / f"fixture-source-{sum(download_counts.values())}.mp4"
              path.write_bytes(variants[attempt])
              download_counts[url] += 1
              return path

          processor.downloader.download = fixture_download
          try:
              first = processor.process(post)
              second = processor.process(post)
              if first.media_count != 2 or second.media_count != 2:
                  raise SystemExit("MEGA integration failed: expected two independent media identities per processing pass.")
              if [item["status"] for item in first.destinations["mega"]["items"]] != ["success", "success"]:
                  raise SystemExit("MEGA integration failed: first pass did not upload both distinct media items.")
              if [item["status"] for item in second.destinations["mega"]["items"]] != ["success", "duplicate"]:
                  raise SystemExit("MEGA integration failed: changed media or true duplicate policy was not preserved.")
              if first.media_reconciliation["destinations"]["mega"]["unaccounted_items"] != 0:
                  raise SystemExit("MEGA integration failed: first pass left an expected item unaccounted.")
              if second.media_reconciliation["destinations"]["mega"]["unaccounted_items"] != 0:
                  raise SystemExit("MEGA integration failed: second pass left an expected item unaccounted.")

              first_names = [item["filename"] for item in first.destinations["mega"]["items"]]
              second_names = [item["filename"] for item in second.destinations["mega"]["items"]]
              if first_names[0] == second_names[0]:
                  raise SystemExit("MEGA integration failed: changed content reused the old media filename.")
              if first_names[1] != second_names[1]:
                  raise SystemExit("MEGA integration failed: unchanged duplicate content did not retain its idempotent identity.")
              remote_folder = first.destinations["mega"]["items"][0].get("remote_folder")
              if not isinstance(remote_folder, str) or not re.fullmatch(
                  re.escape(expected_remote_root) + r"/\d{4}-\d{2}-\d{2}", remote_folder,
              ):
                  raise SystemExit("MEGA integration failed: upload escaped its run-isolated test folder.")

              expected_objects = {
                  first_names[0]: payloads["https://fixture.invalid/item-1-high.mp4"][0],
                  first_names[1]: payloads["https://fixture.invalid/item-2-high.mp4"][0],
                  second_names[0]: payloads["https://fixture.invalid/item-1-high.mp4"][1],
              }
              if len(expected_objects) != 3:
                  raise SystemExit("MEGA integration failed: expected remote filenames collided.")
              uploader._run(["mega-reload"], timeout=120)
              listing = uploader._run(["mega-ls", f"{remote_folder}/"], timeout=120)
              if listing.returncode != 0:
                  raise SystemExit("MEGA integration failed: remote folder listing failed.")
              missing = [name for name in expected_objects if name not in (listing.stdout or "")]
              if missing:
                  raise SystemExit("MEGA integration failed: expected remote objects are missing: " + ", ".join(missing))

              with tempfile.TemporaryDirectory(prefix="x2telegram-mega-download-") as download_dir:
                  for name, expected in expected_objects.items():
                      result = uploader._run(["mega-get", f"{remote_folder}/{name}", download_dir], timeout=300)
                      downloaded = Path(download_dir) / name
                      if result.returncode != 0 or not downloaded.is_file():
                          raise SystemExit(f"MEGA integration failed: could not download verified object {name}.")
                      actual = downloaded.read_bytes()
                      if actual != expected:
                          raise SystemExit(f"MEGA integration failed: downloaded bytes did not match {name}.")
                      print(f"CONTENT_VERIFIED filename={name} bytes={len(actual)} sha256={sha256(actual).hexdigest()}")

              print("MEGA_MEDIA_IDENTITY_AND_VERSION_RETENTION_TEST=PASS expected_objects=3 initial_media_items=2 changed_media_items=1 duplicate_items=1")
          finally:
              try:
                  # This path is isolated by the workflow run ID; never touch user folders.
                  cleanup = uploader._run(["mega-rm", "-r", "-f", expected_remote_root], timeout=120)
                  if cleanup.returncode != 0:
                      raise SystemExit("MEGA integration failed: cleanup of the run-isolated test folder was not confirmed.")
              finally:
                  processor.close()
          PY
